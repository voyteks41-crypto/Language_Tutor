<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Tutor — Avatar 01 — v0.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f2ef;color:#202124;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:720px;min-height:100vh;margin:auto;display:flex;flex-direction:column}
header{padding:18px 20px;display:flex;justify-content:space-between}
.title{font-weight:700}.status{font-size:13px;opacity:.6}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.avatar{width:min(70vw,360px);aspect-ratio:1/1;border-radius:50%;overflow:hidden;box-shadow:0 14px 45px #0002;transition:.2s}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.listening{box-shadow:0 0 0 8px #ffffffaa,0 14px 45px #0003}
.avatar.speaking{transform:scale(1.015)}
.bubble{margin-top:26px;background:#fff;border-radius:22px;padding:18px 20px;width:min(92%,560px);font-size:18px;line-height:1.45;box-shadow:0 5px 20px #0000000b}
.heard{margin-top:10px;font-size:14px;opacity:.55;text-align:center;min-height:20px}
.controls{padding:20px;display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:999px;padding:13px 20px;background:#222;color:#fff;font-size:15px}
button:disabled{opacity:.45}
.hint{text-align:center;font-size:12px;opacity:.55;padding:0 20px 22px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="title">Language Tutor <small>v0.1</small></div>
  <div id="status" class="status">Gotowy</div>
</header>

<main>
  <div id="avatar" class="avatar">
    <img src="avatar-01.jpg" alt="Avatar 01">
  </div>
  <div id="reply" class="bubble">Hola. Cuando quieras, empezamos.</div>
  <div id="heard" class="heard"></div>
</main>

<div class="controls">
  <button id="start">Rozpocznij rozmowę</button>
  <button id="stop" disabled>Zakończ</button>
</div>
<div class="hint">
  Pierwszy test UX: po rozpoczęciu rozmowy mikrofon działa automatycznie.
  Nie trzeba naciskać go przy kolejnych wypowiedziach.
</div>
</div>
<script>
const startBtn = document.querySelector("#start");
const stopBtn = document.querySelector("#stop");
const statusEl = document.querySelector("#status");
const replyEl = document.querySelector("#reply");
const heardEl = document.querySelector("#heard");
const avatar = document.querySelector("#avatar");

const MODEL = "gemini-3.8-live";

let active = false;
let socket = null;
let stream = null;
let audioContext = null;
let inputSource = null;
let processor = null;
let outputContext = null;
let nextPlayTime = 0;

function status(text) {
  statusEl.textContent = text;
}

function base64FromBytes(bytes) {
  let binary = "";
  const chunkSize = 0x8000;

  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode(
      ...bytes.subarray(i, i + chunkSize)
    );
  }

  return btoa(binary);
}

function bytesFromBase64(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes;
}

function floatTo16BitPCM(float32) {
  const buffer = new ArrayBuffer(float32.length * 2);
  const view = new DataView(buffer);

  for (let i = 0; i < float32.length; i++) {
    let sample = Math.max(-1, Math.min(1, float32[i]));
    view.setInt16(
      i * 2,
      sample < 0 ? sample * 0x8000 : sample * 0x7fff,
      true
    );
  }

  return new Uint8Array(buffer);
}

function playPCM16(base64) {
  if (!outputContext) return;

  const bytes = bytesFromBase64(base64);
  const sampleCount = bytes.length / 2;

  const audioBuffer = outputContext.createBuffer(
    1,
    sampleCount,
    24000
  );

  const channel = audioBuffer.getChannelData(0);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  for (let i = 0; i < sampleCount; i++) {
    channel[i] = view.getInt16(i * 2, true) / 32768;
  }

  const source = outputContext.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(outputContext.destination);

  const now = outputContext.currentTime;

  if (nextPlayTime < now) {
    nextPlayTime = now;
  }

  source.start(nextPlayTime);
  nextPlayTime += audioBuffer.duration;

  avatar.classList.add("speaking");
  status("Mówię…");

  source.onended = () => {
    if (nextPlayTime <= outputContext.currentTime + 0.05) {
      avatar.classList.remove("speaking");

      if (active) {
        status("Słucham…");
      }
    }
  };
}

async function getEphemeralToken() {
  const response = await fetch("/api/live-token", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: "{}"
  });

  const data = await response.json();

  if (!response.ok || !data.token) {
    throw new Error(data.error || "Nie udało się uzyskać tokena Gemini.");
  }

  return data.token;
}

async function startMicrophone() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  audioContext = new AudioContext({
    sampleRate: 16000
  });

  inputSource = audioContext.createMediaStreamSource(stream);

  processor = audioContext.createScriptProcessor(4096, 1, 1);

  processor.onaudioprocess = (event) => {
    if (!active || !socket || socket.readyState !== WebSocket.OPEN) {
      return;
    }

    const input = event.inputBuffer.getChannelData(0);
    const pcm = floatTo16BitPCM(input);

    socket.send(JSON.stringify({
      realtimeInput: {
        audio: {
          data: base64FromBytes(pcm),
          mimeType: "audio/pcm;rate=16000"
        }
      }
    }));
  };

  inputSource.connect(processor);
  processor.connect(audioContext.destination);
}

async function startGeminiLive() {
  const token = await getEphemeralToken();

  outputContext = new AudioContext({
    sampleRate: 24000
  });

  await outputContext.resume();

  nextPlayTime = outputContext.currentTime;

  const url =
    "wss://generativelanguage.googleapis.com/ws/" +
    "google.ai.generativelanguage.v1beta.GenerativeService." +
    "BidiGenerateContentConstrained" +
    "?access_token=" +
    encodeURIComponent(token);

  socket = new WebSocket(url);

  socket.onopen = async () => {
    socket.send(JSON.stringify({
      setup: {
        model: `models/${MODEL}`,
        generationConfig: {
          responseModalities: ["AUDIO"]
        },
        systemInstruction: {
          parts: [{
            text:
              "You are an AI language tutor. " +
              "Have a natural conversation with the user in Spanish. " +
              "The user is learning Spanish. " +
              "Do not interrupt or correct every small mistake. " +
              "Correct important grammar or vocabulary mistakes briefly " +
              "and naturally after continuing the conversation. " +
              "If the user uses Polish or English because they do not " +
              "know a Spanish word, provide the Spanish word naturally. " +
              "Keep your responses conversational and reasonably concise."
          }]
        },
        inputAudioTranscription: {},
        outputAudioTranscription: {},
        realtimeInputConfig: {
          automaticActivityDetection: {
            disabled: false
          }
        }
      }
    }));

    try {
      await startMicrophone();

      active = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      replyEl.textContent = "Perfecto. Te escucho.";
      heardEl.textContent = "";
      avatar.classList.add("listening");
      status("Słucham…");

    } catch (error) {
      console.error(error);
      stopConversation();
      status("Nie udało się uruchomić mikrofonu.");
    }
  };

  socket.onmessage = (event) => {
    try {
      const message = JSON.parse(event.data);

      const content = message.serverContent;

      if (!content) return;

      if (content.inputTranscription?.text) {
        heardEl.textContent =
          "Ty: " + content.inputTranscription.text;
        avatar.classList.add("listening");
      }

      if (content.outputTranscription?.text) {
        replyEl.textContent =
          content.outputTranscription.text;
      }

      if (content.modelTurn?.parts) {
        for (const part of content.modelTurn.parts) {
          if (part.inlineData?.data) {
            playPCM16(part.inlineData.data);
          }
        }
      }

      if (content.turnComplete) {
        avatar.classList.remove("speaking");

        if (active) {
          avatar.classList.add("listening");
          status("Słucham…");
        }
      }
    } catch (error) {
      console.error("Błąd odpowiedzi Gemini:", error);
    }
  };

  socket.onerror = (error) => {
    console.error("Gemini WebSocket error:", error);
    status("Błąd połączenia z Gemini.");
  };

  socket.onclose = (event) => {
    console.log(
      "Gemini WebSocket closed:",
      event.code,
      event.reason
    );

    if (active) {
      stopConversation();
      status("Połączenie z Gemini zakończone.");
    }
  };
}

async function startConversation() {
  if (active) return;

  try {
    status("Łączenie z Gemini…");
    replyEl.textContent = "Łączę się…";

    await startGeminiLive();

  } catch (error) {
    console.error(error);

    stopConversation();

    status("Nie udało się połączyć z Gemini.");
    replyEl.textContent = error.message;
  }
}

function stopConversation() {
  active = false;

  if (processor) {
    try {
      processor.disconnect();
    } catch (e) {}
    processor = null;
  }

  if (inputSource) {
    try {
      inputSource.disconnect();
    } catch (e) {}
    inputSource = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  if (audioContext) {
    try {
      audioContext.close();
    } catch (e) {}
    audioContext = null;
  }

  if (socket) {
    try {
      socket.close();
    } catch (e) {}
    socket = null;
  }

  if (outputContext) {
    try {
      outputContext.close();
    } catch (e) {}
    outputContext = null;
  }

  nextPlayTime = 0;

  avatar.classList.remove("listening", "speaking");

  startBtn.disabled = false;
  stopBtn.disabled = true;
}

startBtn.onclick = startConversation;
stopBtn.onclick = () => {
  stopConversation();
  status("Rozmowa zakończona");
  replyEl.textContent = "Hasta luego.";
};
